# TeamLaunch 打包配置 —— electron-builder 26.15.3 + NSIS
#
# 选 electron-builder 而非 Forge 的决定性理由（ADR-004）：
# 防火墙入站规则必须在**提权安装阶段**创建。NSIS 下由「为所有用户安装」模式 +
# UAC 插件在提权后执行 build/installer.nsh 里的建规则步骤（Forge 的 Squirrel
# 安装器全程非提权，建不了规则）。
appId: com.teamlaunch.app
productName: TeamLaunch
copyright: Copyright © 2026
directories:
  output: dist/installer
  buildResources: build
files:
  - dist/renderer/**/*
  - dist/preload/**/*
  - dist/main/**/*
  - package.json
# 托盘图标：托盘代码从 resources/tray.ico 读取（src/main/tray.ts）。
extraResources:
  - from: build/tray.ico
    to: tray.ico
  # 更新日志随包分发（设置·关于 →「查看更新日志」直接读它渲染，离线也能看）
  - from: CHANGELOG.md
    to: CHANGELOG.md
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: TeamLaunch-Setup-${version}.${ext}
  # 防火墙规则必须限定 -RemoteAddress LocalSubnet，且只作用于 Domain/Private 配置文件。
  # 公用网络配置文件下规则不生效（K-01），诊断页会检测并引导切换。
nsis:
  oneClick: false
  # 刻意**不写** perMachine：保留安装器的「为所有用户安装 / 仅为当前用户安装」选择页。
  #  - 员工机选「仅我」→ 装到 %LOCALAPPDATA%\Programs，全程无提权；之后每次自动更新零 UAC；
  #  - 管理员机选「所有用户」→ 当场提权（UAC 插件），防火墙入站规则在这一步创建（ADR-004）。
  # 升级时安装器读注册表里的既有模式原地升级（templates/nsis/assistedInstaller.nsh 的
  # initMultiUser），所以同一个安装包能同时服务 per-machine 与 per-user 两种装机。
  # 反过来说：per-machine 与 per-user 不能在同机混装，迁移时必须先卸载旧的那种。
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: TeamLaunch
  include: build/installer.nsh
  # 入站规则只在「所有用户」安装时创建、也只在「所有用户」卸载时移除（见 installer.nsh）
  guid: 7f3a92c1-4b81-9f2e-0c8a5d1e7b30
mac:
  target: []
linux:
  target: []
